name: Instalar HIKARI Banner

on:
  workflow_dispatch:
  push:
    paths:
      - "HIKARI-Banner-Sem-Gap.zip"

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar HIKARI
        run: |
          unzip -o HIKARI-Banner-Sem-Gap.zip -d .
          rm HIKARI-Banner-Sem-Gap.zip

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar HIKARI Banner"
          git push
