name: Instalar HIKARI Conta Admin

on:
  workflow_dispatch:
  push:
    paths:
      - "HIKARI-Conta-Admin.zip"

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar HIKARI
        run: |
          unzip -o HIKARI-Conta-Admin.zip -d .
          rm HIKARI-Conta-Admin.zip

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar HIKARI Conta Admin"
          git push
