name: Deploy HIKARI Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar arquivo news no Git
        run: |
          echo "Commit atual:"
          git rev-parse HEAD

          echo ""
          echo "Verificando news.tsx diretamente no commit:"
          git cat-file -e HEAD:src/routes/news.tsx

          echo ""
          echo "Arquivo news.tsx encontrado no commit."
          git show --stat --oneline HEAD
          echo ""
          git ls-tree HEAD src/routes/news.tsx

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Verificar versao do tsr
        run: npx tsr --version

      - name: Verificar arquivo news
        run: |
          test -f src/routes/news.tsx
          echo "news.tsx encontrado no workspace."

      - name: Gerar rotas
        run: npm run generate-routes

      - name: Verificar rota news
        run: |
          grep -n 'news' src/routeTree.gen.ts

      - name: Build Cloudflare
        run: npm run build:cloudflare

      - name: Deploy Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
