name: Deploy HIKARI Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar historico do Git
        run: |
          echo "REPOSITORIO:"
          git remote -v

          echo ""
          echo "COMMIT ATUAL:"
          git rev-parse HEAD

          echo ""
          echo "INFORMACOES DO COMMIT 9400f35:"
          git show --stat --oneline 9400f35

          echo ""
          echo "ARQUIVOS DO COMMIT 9400f35:"
          git ls-tree -r 9400f35 --name-only | grep 'news.tsx' || true

          echo ""
          echo "TESTE DO ARQUIVO:"
          git show 9400f35:src/routes/news.tsx || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Verificar versao do tsr
        run: npx tsr --version

      - name: Verificar arquivo news
        run: |
          test -f src/routes/news.tsx
          echo "news.tsx encontrado no workspace."

      - name: Gerar rotas
        run: npm run generate-routes

      - name: Verificar rota news
        run: |
          grep -n 'news' src/routeTree.gen.ts

      - name: Build Cloudflare
        run: npm run build:cloudflare

      - name: Deploy Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
