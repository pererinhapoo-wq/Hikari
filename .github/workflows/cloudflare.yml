name: Deploy HIKARI Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar arquivo news
        run: |
          echo "COMMIT ATUAL:"
          git rev-parse HEAD
          echo ""

          echo "ARQUIVO NEWS:"
          test -f src/routes/news.tsx
          echo "news.tsx encontrado no workspace."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Verificar versao do tsr
        run: npx tsr --version

      - name: Verificar arquivos de rotas
        run: |
          echo "ROTAS ADULT:"

          test -f src/routes/adult.tsx
          echo "adult.tsx encontrado."

          test -f src/routes/adult_.news.tsx
          echo "adult_.news.tsx encontrado."

          echo ""
          echo "ARQUIVOS ADULT NA PASTA:"
          find src/routes -maxdepth 1 -type f -iname '*adult*' -print

      - name: Gerar rotas
        run: npm run generate-routes

      - name: Verificar rotas geradas
        run: |
          grep -n 'adult' src/routeTree.gen.ts
          grep -n 'news' src/routeTree.gen.ts

      - name: Build Cloudflare
        run: npm run build:cloudflare

      - name: Deploy Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
