name: Deploy HIKARI Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar historico do Git
        run: |
          echo "Commit atual:"
          git rev-parse HEAD

          echo ""
          echo "Verificando commit 9400f35:"
          git show 9400f35:src/routes/news.tsx > /tmp/news.tsx

          echo ""
          echo "news.tsx encontrado dentro do commit 9400f35."

          echo ""
          echo "Verificando se 9400f35 e ancestral do commit atual:"
          git merge-base --is-ancestor 9400f35 HEAD
          echo "9400f35 e ancestral do HEAD."

          echo ""
          echo "Arvore de src/routes no HEAD:"
          git ls-tree HEAD src/routes

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Verificar versao do tsr
        run: npx tsr --version

      - name: Verificar arquivo news
        run: |
          test -f src/routes/news.tsx
          echo "news.tsx encontrado no workspace."

      - name: Gerar rotas
        run: npm run generate-routes

      - name: Verificar rota news
        run: |
          grep -n 'news' src/routeTree.gen.ts

      - name: Build Cloudflare
        run: npm run build:cloudflare

      - name: Deploy Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
