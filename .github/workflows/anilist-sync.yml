name: Sincronização Periódica AniList (Hikari)

on:
  schedule:
    # Executa Segunda e Quinta às 03:00 UTC (o script valida getUTCDay() conforme a frequência configurada: 1_per_week ou 2_per_week)
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de execução manual (test = dry-run seguro sem gravação; real = sincronização completa)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - real
      frequency_override:
        description: 'Sobrescrever frequência para teste (ex: 1_per_week ou 2_per_week)?'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: anilist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências com bun.lock
        run: bun install --frozen-lockfile

      - name: Executar Sincronização AniList
        # IMPORTANTE: secrets.DATABASE_URL deve apontar para o endpoint DIRETO (non-pooled) do Neon
        # para garantir sessões estáveis ao PostgreSQL Advisory Lock (849201).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FREQUENCY_OVERRIDE: ${{ inputs.frequency_override }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MODE" != "real" ]; then
            node scripts/anilist-sync.mjs --test
          else
            EXTRA_ARGS=""
            if [ -n "$INPUT_FREQUENCY_OVERRIDE" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --frequency=$INPUT_FREQUENCY_OVERRIDE"
            fi
            node scripts/anilist-sync.mjs $EXTRA_ARGS
          fi

