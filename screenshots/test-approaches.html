
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #09090b; color: white; font-family: sans-serif; }
  .grid { display: flex; flex-direction: column; gap: 40px; padding: 20px; max-width: 420px; margin: 0 auto; }
  .card { background: #12101e; border: 1px solid #332b50; border-radius: 16px; overflow: hidden; }
  .card-title { padding: 12px; font-size: 14px; font-weight: bold; background: #1a162b; }
  
  /* Approach 1: Current Cover (Fixed h=200px) */
  .hero-1 { position: relative; height: 200px; width: 100%; background: #09090b; overflow: hidden; }
  .hero-1 img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
  
  /* Approach 2: Smart Aspect / Cinematic framing (contain at top with dark transition) */
  .hero-2 { position: relative; width: 100%; height: 200px; background: #09090b; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; }
  .hero-2 img { width: 100%; height: 100%; object-fit: contain; object-position: top center; }
  
  /* Approach 3: Scaled banner (max natural proportion with smooth dark bleed) */
  .hero-3 { position: relative; width: 100%; background: #09090b; overflow: hidden; }
  .hero-3 .img-wrap { width: 100%; aspect-ratio: 16/9; max-height: 220px; position: relative; }
  .hero-3 img { width: 100%; height: 100%; object-fit: cover; object-position: center center; }

  /* Approach 4: Smart framing: object-fit contain on ultra-wide with subtle ambient blur background */
  .hero-4 { position: relative; height: 180px; width: 100%; background: #09090b; overflow: hidden; }
  .hero-4 img.main { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; object-position: center center; }

  /* Approach 5: Widescreen Cinematic (Banner width 100%, height auto, with subtle padding/gradient) */
  .hero-5 { position: relative; width: 100%; min-height: 140px; max-height: 180px; background: #09090b; overflow: hidden; }
  .hero-5 img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }

  .gradient { position: absolute; inset-x: 0; bottom: 0; height: 70px; background: linear-gradient(to top, #09090b, rgba(9,9,11,0.7) 50%, transparent); pointer-events: none; z-index: 5; }
  .top-gradient { position: absolute; inset-x: 0; top: 0; height: 50px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); pointer-events: none; z-index: 5; }
  
  .poster-mock { position: absolute; bottom: -20px; left: 16px; width: 90px; height: 135px; border-radius: 12px; border: 2px solid rgba(168,85,247,0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 10; background: #2a2540; object-fit: cover; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="card-title">1. Current (Cover 200px, center 35%)</div>
      <div class="hero-1">
        <img src="screenshots/banner-195539-cyberpunk.jpg" />
        <div class="top-gradient"></div>
        <div class="gradient"></div>
        <img class="poster-mock" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx195539-4LdfmKIHzuxr.png" />
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. Contain top (Full width, dark lower background)</div>
      <div class="hero-2">
        <img src="screenshots/banner-195539-cyberpunk.jpg" />
        <div class="top-gradient"></div>
        <div class="gradient"></div>
        <img class="poster-mock" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx195539-4LdfmKIHzuxr.png" />
      </div>
    </div>
  </div>
</body>
</html>
